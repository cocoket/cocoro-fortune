<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>今日のこころ新聞｜ここケット</title>
    <link rel="stylesheet" href="kokoro-shinbun.css">
  </head>
  <body>
    <main class="newspaper-app" aria-live="polite">
      <a class="back-link" href="./">今日のこころ占いへ戻る</a>
      <section id="newspaperResult" class="newspaper-result">
        <p>今日のこころ新聞を準備しています…</p>
      </section>
    </main>

    <script>
      // 新聞画像は現在の日付ではなく、刊（朝刊・夕刊）とカードで選ぶ。
      // これで日付が変わっても「準備中」にならない。
      const newspaperImages = {
        "morning|club-5": [
          "images/kokoro_shinbun/club5_morning.png",
          "images/images/kokoro_shinbun/club5_morning.png",
          "画像/kokoro_shinbun/club5_morning.png"
        ],
        "evening|club-5": [
          "images/kokoro_shinbun/club5_evening.png",
          "images/images/kokoro_shinbun/club5_evening.png",
          "画像/kokoro_shinbun/club5_evening.png"
        ],
        "morning|heart-7": [
          "images/kokoro_shinbun/heart7_morning.png",
          "images/images/kokoro_shinbun/heart7_morning.png",
          "画像/kokoro_shinbun/heart7_morning.png"
        ],
        "evening|heart-7": [
          "images/kokoro_shinbun/heart7_evening.png",
          "images/images/kokoro_shinbun/heart7_evening.png",
          "画像/kokoro_shinbun/heart7_evening.png"
        ]
      };

      const params = new URLSearchParams(window.location.search);
      const date = params.get("date") || "";
      const edition = params.get("edition") || "";
      const card = params.get("card") || "";
      const content = params.get("content") || "";
      const key = edition + "|" + card;
      const imagePaths = newspaperImages[key];
      const result = document.getElementById("newspaperResult");

      if (imagePaths && content === "v0.1-locked") {
        const image = document.createElement("img");
        image.className = "newspaper-image";
        image.alt = "今日のこころ新聞";
        let pathIndex = 0;
        image.src = imagePaths[pathIndex];
        image.addEventListener("error", function () {
          pathIndex += 1;
          if (pathIndex < imagePaths.length) {
            image.src = imagePaths[pathIndex];
          }
        });
        result.replaceChildren(image);
      } else {
        result.innerHTML =
          "<h1>今日のこころ新聞</h1>" +
          "<p>このカードの新聞は、ただいま準備中です。</p>" +
          "<p class=\"small-note\">新しい新聞ができたら、ここに届きます。</p>";
      }
    </script>
  </body>
</html>
